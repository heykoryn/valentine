<!-- index.html -->
<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noimageindex">
<meta property="og:title" content="Scratch Reveal">
<meta property="og:description" content="A little surprise for you 🖤">
<meta property="og:image" content="scratch-cover.png">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Scratch Reveal</title>
  <style>
    :root{
      /* page background (you mentioned using a card color like this) */
      --page-bg: #1b82c1;
      --shadow: 0 18px 45px rgba(0,0,0,.35);
    }

    html, body {
      height: 100%;
      margin: 0;
      background: var(--page-bg);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      overflow-x: hidden;
    }

    .wrap{
      min-height: 100%;
      display: grid;
      place-items: center;
      padding: 18px 12px;
    }

    .card{
      position: relative;
      width: min(92vw, 820px);
      /* keep the image crisp */
      image-rendering: auto;
      filter: drop-shadow(var(--shadow));
      border-radius: 10px; /* subtle on desktop; image itself is rectangular */
      overflow: visible;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none; /* important for mobile scratching */
    }

    .card img{
      display:block;
      width:100%;
      height:auto;
    }

    /* Scratch canvas sits on top of the exact frame area */
    #scratchCanvas{
      position:absolute;
      left:0;
      top:0;
      pointer-events:auto;
      touch-action:none;
      border-radius: 6px;
      opacity: 1;
      transition: opacity 650ms ease;
    }

    .hint{
      margin-top: 14px;
      color: rgba(255,255,255,.9);
      font-size: 14px;
      text-align: center;
      max-width: 60ch;
    }

    .hint strong{ color:#fff; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card" id="card">
      <img id="cardImg" src="card.png" alt="Scratch card" draggable="false" />
      <canvas id="scratchCanvas" aria-label="Scratch to reveal"></canvas>
    </div>

    <div class="hint">
      <strong>Tip:</strong> scratch on the framed area to reveal 🎟️ (works on mobile + desktop)
    </div>
  </div>

  <audio id="revealAudio" preload="auto" src="cardaudio.mp3"></audio>

  <script>
    // ====== CONFIG YOU CAN TWEAK ======
    // These are the scratch-area bounds measured on the *original* card.png pixels.
    // (Lined up to the frame under "Scratch here".)
    const SCRATCH_BOUNDS = {
      x0: 183,  // left
      y0: 1148, // top
      x1: 913,  // right
      y1: 1828  // bottom
    };

    const AUDIO_START_SECONDS = 9;     // start at 9s into mp3
    const REVEAL_THRESHOLD = 0.60;     // % cleared needed to trigger reveal (0-1)
    const BRUSH_RADIUS_BASE = 26;      // brush size in CSS pixels (auto-adjusted a bit)
    // =================================

    const img = document.getElementById('cardImg');
    const card = document.getElementById('card');
    const canvas = document.getElementById('scratchCanvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    const audio = document.getElementById('revealAudio');

    let isPointerDown = false;
    let lastPt = null;
    let revealed = false;
    let strokes = 0;

    function clamp(n, a, b){ return Math.max(a, Math.min(b, n)); }

    function layoutCanvasToImage() {
      // Use the displayed image size to scale the scratch region
      const rect = img.getBoundingClientRect();
      const naturalW = img.naturalWidth;
      const naturalH = img.naturalHeight;

      if (!naturalW || !naturalH) return;

      const scaleX = rect.width / naturalW;
      const scaleY = rect.height / naturalH;

      const left = SCRATCH_BOUNDS.x0 * scaleX;
      const top  = SCRATCH_BOUNDS.y0 * scaleY;
      const w    = (SCRATCH_BOUNDS.x1 - SCRATCH_BOUNDS.x0) * scaleX;
      const h    = (SCRATCH_BOUNDS.y1 - SCRATCH_BOUNDS.y0) * scaleY;

      // Position canvas over the scratch region
      canvas.style.left = `${left}px`;
      canvas.style.top  = `${top}px`;
      canvas.style.width = `${w}px`;
      canvas.style.height = `${h}px`;

      // Set the actual backing store size for crispness
      const dpr = window.devicePixelRatio || 1;
      canvas.width  = Math.floor(w * dpr);
      canvas.height = Math.floor(h * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0); // draw in CSS pixels

      drawScratchCoating(w, h);
    }

    function drawScratchCoating(w, h) {
      revealed = false;
      strokes = 0;
      lastPt = null;
      canvas.style.opacity = '1';

      // Base coating
      ctx.globalCompositeOperation = 'source-over';
      ctx.clearRect(0, 0, w, h);

      // A slightly “scratchy” coating look
      ctx.fillStyle = '#b9b9b9';
      ctx.fillRect(0, 0, w, h);

      // Add some speckle/noise
      for (let i = 0; i < 900; i++) {
        const x = Math.random() * w;
        const y = Math.random() * h;
        const r = Math.random() * 1.6 + 0.4;
        const a = Math.random() * 0.18 + 0.04;
        ctx.fillStyle = `rgba(255,255,255,${a})`;
        ctx.beginPath();
        ctx.arc(x, y, r, 0, Math.PI * 2);
        ctx.fill();
      }
      for (let i = 0; i < 650; i++) {
        const x = Math.random() * w;
        const y = Math.random() * h;
        const r = Math.random() * 1.4 + 0.3;
        const a = Math.random() * 0.20 + 0.05;
        ctx.fillStyle = `rgba(0,0,0,${a})`;
        ctx.beginPath();
        ctx.arc(x, y, r, 0, Math.PI * 2);
        ctx.fill();
      }

      // Optional: subtle sheen
      const grad = ctx.createLinearGradient(0, 0, w, h);
      grad.addColorStop(0, 'rgba(255,255,255,0.18)');
      grad.addColorStop(0.5, 'rgba(255,255,255,0.04)');
      grad.addColorStop(1, 'rgba(0,0,0,0.08)');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, w, h);

      // Prepare for erasing strokes
      ctx.globalCompositeOperation = 'destination-out';
      ctx.lineJoin = 'round';
      ctx.lineCap = 'round';
    }

    function getCanvasPointFromEvent(e) {
      const r = canvas.getBoundingClientRect();
      const x = (e.clientX - r.left);
      const y = (e.clientY - r.top);
      return { x: clamp(x, 0, r.width), y: clamp(y, 0, r.height) };
    }

    function scratchTo(pt) {
      const r = canvas.getBoundingClientRect();
      const w = r.width, h = r.height;

      // brush radius adapts slightly to screen size
      const brush = clamp(BRUSH_RADIUS_BASE * (w / 720), 18, 42);

      ctx.lineWidth = brush * 2;

      if (!lastPt) {
        ctx.beginPath();
        ctx.arc(pt.x, pt.y, brush, 0, Math.PI * 2);
        ctx.fill();
        lastPt = pt;
        return;
      }

      ctx.beginPath();
      ctx.moveTo(lastPt.x, lastPt.y);
      ctx.lineTo(pt.x, pt.y);
      ctx.stroke();

      // also stamp circles to avoid gaps
      ctx.beginPath();
      ctx.arc(pt.x, pt.y, brush, 0, Math.PI * 2);
      ctx.fill();

      lastPt = pt;
    }

    function clearedFractionSampled(step = 10) {
      // Sample alpha channel to estimate cleared area quickly.
      // step=10 means we read every 10th pixel in both directions.
      const r = canvas.getBoundingClientRect();
      const w = Math.floor(r.width);
      const h = Math.floor(r.height);

      // Use backing store (already dpr-scaled) but we draw in CSS pixels,
      // so sampling in CSS pixels via getImageData on the full canvas works fine.
      const imgData = ctx.getImageData(0, 0, w, h).data;

      let cleared = 0;
      let total = 0;

      for (let y = 0; y < h; y += step) {
        for (let x = 0; x < w; x += step) {
          const idx = (y * w + x) * 4 + 3; // alpha
          const a = imgData[idx];
          // destination-out makes cleared pixels alpha=0
          if (a === 0) cleared++;
          total++;
        }
      }
      return total ? (cleared / total) : 0;
    }

    function triggerReveal() {
      if (revealed) return;
      revealed = true;

      // Fade the coating away (even if not 100% scratched)
      canvas.style.opacity = '0';

      // Start audio at 9s — should be allowed because the user just interacted
      try {
        audio.currentTime = AUDIO_START_SECONDS;
      } catch (_) { /* some browsers require metadata loaded; we’ll still try play */ }

      const playPromise = audio.play();
      if (playPromise && typeof playPromise.catch === 'function') {
        playPromise.catch(() => {
          // If autoplay policies block it, user can tap again to start.
          // (We keep it quiet here on purpose.)
        });
      }
    }

    function onPointerDown(e) {
      if (revealed) return;
      isPointerDown = true;
      lastPt = null;
      canvas.setPointerCapture?.(e.pointerId);
      scratchTo(getCanvasPointFromEvent(e));
      e.preventDefault();
    }

    function onPointerMove(e) {
      if (!isPointerDown || revealed) return;
      scratchTo(getCanvasPointFromEvent(e));
      strokes++;

      // Check reveal progress every few moves to keep it fast
      if (strokes % 14 === 0) {
        const frac = clearedFractionSampled(10);
        if (frac >= REVEAL_THRESHOLD) triggerReveal();
      }
      e.preventDefault();
    }

    function onPointerUp(e) {
      if (revealed) return;
      isPointerDown = false;
      lastPt = null;

      // One final check when they lift
      const frac = clearedFractionSampled(10);
      if (frac >= REVEAL_THRESHOLD) triggerReveal();

      e.preventDefault();
    }

    // Make sure the canvas lines up once the image is loaded
    img.addEventListener('load', () => {
      layoutCanvasToImage();
    });

    window.addEventListener('resize', () => {
      // Resizing resets the coating to keep alignment perfect.
      // (If you want to preserve scratch progress across resizes, tell me.)
      layoutCanvasToImage();
    });

    // Pointer events cover mouse + touch + pen
    canvas.addEventListener('pointerdown', onPointerDown, { passive: false });
    canvas.addEventListener('pointermove', onPointerMove, { passive: false });
    canvas.addEventListener('pointerup', onPointerUp, { passive: false });
    canvas.addEventListener('pointercancel', onPointerUp, { passive: false });

    // If the browser blocks audio, a tap after reveal will start it
    document.addEventListener('pointerdown', () => {
      if (!revealed) return;
      if (audio.paused) {
        try { audio.currentTime = Math.max(audio.currentTime, AUDIO_START_SECONDS); } catch(_) {}
        audio.play().catch(()=>{});
      }
    });

    // If the image is cached and load already happened
    if (img.complete) layoutCanvasToImage();
  </script>
</body>
</html>
